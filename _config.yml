title: "Joshua McGregor"
description: "Engineering Student Portfolio"
url: "https://joshuamcgregoraero.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "dark"

collections:
  interests:
    output: true
  current_projects:
    output: true
  completed_projects:
    output: true

defaults:
  - scope:
      path: ""
      type: interests
    values:
      layout: post
  - scope:
      path: ""
      type: current_projects
    values:
      layout: post
  - scope:
      path: ""
      type: completed_projects
    values:
      layout: post

header_pages:
  - about.md
  - interests.md
  - current_projects.md
  - completed_projects.md
